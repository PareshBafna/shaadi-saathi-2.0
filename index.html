<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shaadi Saathi — Complete Wedding Hospitality & Planning OS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./pages/home/home.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            obsidian: '#0A0507', surface: '#140A0D', card: '#1D0F14', cardHover: '#28151C',
            borderWarm: '#3D2029', gold: '#F5C451', goldBright: '#FFE082', emeraldSS: '#22C55E',
            crimsonSS: '#EF4444', amberSS: '#F59E0B', skySS: '#38BDF8', waGreen: '#25D366',
            cream: '#FFFDF9', ink: '#F5ECEE', muted: '#C8B0B6'
          },
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    }
  </script>
</head>
<body class="selection:bg-gold selection:text-obsidian">
  <header class="sticky top-0 z-40 bg-obsidian/90 backdrop-blur-xl border-b border-borderWarm w-full px-4 sm:px-8 lg:px-14 py-3.5">
    <div class="w-full flex items-center">
      <div onclick="switchRootMode('home')" class="flex items-center gap-3 cursor-pointer">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-gold to-amber-700 p-[1.5px]">
          <div class="w-full h-full bg-obsidian rounded-[10px] flex items-center justify-center font-serif font-bold text-lg gold-text">SS</div>
        </div>
        <div>
          <span class="font-serif italic text-2xl font-bold gold-text block leading-none">Shaadi Saathi</span>
          <span class="text-xs text-muted">Complete Wedding Hospitality &amp; Planning OS</span>
        </div>
      </div>
    </div>
  </header>

  <div id="root-home" class="hp w-full">
    <div id="home-hero-slot"></div>
    <div id="home-comparison-slot"></div>
    <div id="home-services-slot"></div>
    <div id="home-pricing-slot"></div>
    <div id="home-addons-slot"></div>
    <div id="home-faq-slot"></div>
  </div>

  <script type="module" src="./global/state.js"></script>
</body>
</html>
