<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>Shaadi Saathi — Planner OS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="weddings.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            obsidian: '#0A0507',
            surface: '#140A0D',
            card: '#1D0F14',
            borderWarm: '#3D2029',
            gold: '#F5C451',
            emeraldSS: '#22C55E',
            crimsonSS: '#EF4444',
            amberSS: '#F59E0B',
            skySS: '#38BDF8',
            waGreen: '#25D366',
            cream: '#FFFDF9',
            muted: '#C8B0B6'
          },
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    }
  </script>
</head>
<body class="selection:bg-gold selection:text-obsidian">

  <!-- STICKY HEADER -->
  <header class="sticky top-0 z-40 bg-obsidian/90 backdrop-blur-xl border-b border-borderWarm w-full px-4 sm:px-8 lg:px-14 py-3.5">
    <div class="w-full flex items-center justify-between">
      <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.reload()">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-gold to-amber-700 p-[1.5px]">
          <div class="w-full h-full bg-obsidian rounded-[10px] flex items-center justify-center font-serif font-bold text-lg gold-text">SS</div>
        </div>
        <div>
          <span class="font-serif italic text-2xl font-bold gold-text block leading-none">Shaadi Saathi</span>
          <span class="text-xs text-muted">Complete Wedding Hospitality &amp; Planning OS</span>
        </div>
      </div>
    </div>
  </header>

  <!-- ROOT SLOT FOR SUB-VIEWS -->
  <main id="app-root" class="w-full px-4 sm:px-8 lg:px-12 pt-6 space-y-6">
    <!-- View 1: Directory -->
    <section id="creator-all-weddings" class="space-y-6"></section>

    <!-- View 2: Single Wedding Workspace -->
    <section id="creator-single-workspace" class="space-y-6 hidden"></section>
  </main>

  <!-- MODALS SLOT -->
  <div id="modal-slot"></div>

  <!-- TOAST NOTIFICATION -->
  <div id="toastBox" class="fixed top-5 right-4 z-50 hidden bg-card border-2 border-gold text-cream px-5 py-3 rounded-xl shadow-2xl text-sm font-bold"></div>

  <!-- SCRIPT BOOT -->
  <script type="module" src="weddings.js"></script>
</body>
</html>
